services:
  meilisearch:
    image: getmeili/meilisearch:v1.17
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-dev-master-key}
      MEILI_NO_ANALYTICS: "true"
      MEILI_LOG_LEVEL: WARN
    volumes:
      - meilisearch_data:/meili_data
    restart: unless-stopped

volumes:
  meilisearch_data:
