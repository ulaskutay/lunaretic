# Laravel-only paths. Storefront HTML (/urun, /koleksiyon, /sepet, …) is served by Next.js.

location ^~ /platform {
    try_files $uri $uri/ /index.php?$query_string;
}

location ^~ /lunar {
    try_files $uri $uri/ /index.php?$query_string;
}

location ^~ /api {
    try_files $uri $uri/ /index.php?$query_string;
}

location ^~ /livewire {
    try_files $uri $uri/ /index.php?$query_string;
}

location ^~ /storage {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
    try_files $uri =404;
}

location ^~ /build {
    try_files $uri =404;
}

location ^~ /css/ {
    try_files $uri =404;
}

location ^~ /js/ {
    try_files $uri =404;
}

location ^~ /fonts/ {
    try_files $uri =404;
}

location = /up {
    try_files $uri /index.php?$query_string;
}

location = /sitemap.xml {
    try_files $uri /index.php?$query_string;
}

location = /robots.txt {
    try_files $uri /index.php?$query_string;
}

location ^~ /feed/ {
    try_files $uri /index.php?$query_string;
}
